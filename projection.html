<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTIC Bible Projector — Projection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:ital,wght@0,300;0,400;1,300&display=swap">
  <style>
    /* ══ VARIABLES & RESET ══════════════════════════════════════════════════ */
    :root {
      --lt-ref-text:    #ffffff;
      --lt-verse-text:  #16308f;
      --lt-font:        'Arial Black', sans-serif;
      --lt-width:       1240px;
      --lt-height:      248px;
      --lt-ref-size:    30px;
      --lt-verse-size:  38px;

      --tp-green:  #009A44;
      --tp-yellow: #FBDE4A;
      --tp-red:    #DC241F;

      --song-bg:   #000000;
      --song-text: #ffffff;
      --song-font: 'Arial', sans-serif;
      --song-size: 70px;

      --p-name-size:  30px;
      --p-title-size: 24px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #000000;
    }

    /* Fond transparent pour OBS chroma key */
    body.transparent-bg { background: transparent; }

    /* ── Conteneurs de mode (tous cachés par défaut) ── */
    .proj-mode {
      display: none;
      width: 100vw; height: 100vh;
      position: relative;
    }
    .proj-mode.active { display: block; }


    /* ══ ICTHEME — BIBLE & PERSONNE LT ════════════════════════════════════ */

    .stage { position: absolute; inset: 0; }

    /* Positionnement commun du lower-third */
    .lower-third {
      position: absolute;
      left: 50%; bottom: 48px;
      transform: translateX(-50%);
      width: var(--lt-width);
      height: var(--lt-height);
      pointer-events: none;
    }

    /* Badge référence Bible / badge titre Personne */
    .reference-badge,
    .title-badge {
      position: absolute; left: 0; top: 0;
      height: 64px; min-width: 240px;
      padding: 0 36px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 32px;
      background: linear-gradient(90deg, #0a2f8b 0%, #2347d1 35%, #d6009d 100%);
      box-shadow: 0 12px 24px rgba(0,0,0,.35),
                  0 0 0 1px rgba(255,255,255,.12) inset,
                  0 0 28px rgba(255,0,180,.25);
      z-index: 3;
    }
    .reference-badge::after,
    .title-badge::after {
      content: ""; position: absolute; inset: 0; border-radius: 32px;
      background: linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,0) 60%);
      pointer-events: none;
    }
    .reference-badge span,
    .title-badge span {
      position: relative; z-index: 1;
      color: var(--lt-ref-text);
      font-size: var(--lt-ref-size);
      font-weight: 900; letter-spacing: 1.8px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.2);
      white-space: nowrap;
    }

    /* Carte blanche principale */
    .main-card {
      position: absolute; left: 0; right: 0; top: 34px;
      height: calc(var(--lt-height) - 34px);
      border-radius: 40px; background: white; padding: 8px;
      box-shadow: 0 18px 32px rgba(0,0,0,.28), 0 0 40px rgba(181,19,123,.15);
    }
    .main-card::before {
      content: ""; position: absolute; inset: 0; border-radius: 40px; padding: 8px;
      background: linear-gradient(135deg, #0a2f8b 0%, #2347d1 35%, #d6009d 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none; z-index: 1;
    }
    .card-inner {
      position: relative; width: 100%; height: 100%;
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(255,255,255,.99), rgba(250,250,250,.98));
      overflow: hidden; z-index: 2;
    }
    .card-inner::before {
      content: ""; position: absolute; inset: 0; border-radius: 32px;
      background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,0) 45%);
      pointer-events: none;
    }

    /* Texte verset (Bible ictheme) / nom personne (ictheme) */
    .verset-text,
    .main-text {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 0 72px; text-align: center;
      color: var(--lt-verse-text);
      font-size: var(--lt-verse-size);
      font-weight: 900; letter-spacing: 1.5px;
      text-transform: uppercase; line-height: 1.15;
      text-shadow: 0 1px 0 rgba(255,255,255,.85), 0 2px 4px rgba(0,0,0,.08);
      z-index: 1; overflow-y: auto; max-height: 100%; white-space: pre-wrap;
    }

    /* Points de navigation segments */
    .segment-nav {
      position: absolute; left: 50%; bottom: 6px;
      transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 10;
    }
    .seg-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(22,48,143,.35);
      transition: background 0.2s;
    }
    .seg-dot.active { background: var(--lt-verse-text); }

    /* Animations ictheme */
    .lower-third.anim-in  { animation: slideInUp    0.6s cubic-bezier(.34,1.56,.64,1) forwards; }
    .lower-third.anim-out { animation: slideOutDown 0.5s ease-in forwards; }
    .lower-third.anim-in  .reference-badge,
    .lower-third.anim-in  .title-badge      { animation: fadeInScaleLeft  0.5s cubic-bezier(.34,1.56,.64,1) 0.3s both; }
    .lower-third.anim-out .reference-badge,
    .lower-third.anim-out .title-badge      { animation: fadeOutScaleLeft 0.4s ease-in forwards; }

    @keyframes slideInUp    {
      from { transform: translate(-50%, 100%); opacity: 0; }
      to   { transform: translate(-50%, 0);    opacity: 1; }
    }
    @keyframes slideOutDown {
      from { transform: translate(-50%, 0);    opacity: 1; }
      to   { transform: translate(-50%, 100%); opacity: 0; }
    }
    @keyframes fadeInScaleLeft  { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fadeOutScaleLeft { from { transform: scale(1);  opacity: 1; } to { transform: scale(.9); opacity: 0; } }


    /* ══ TOURPAC — BIBLE & PERSONNE LT ════════════════════════════════════ */

    /* Positionneur commun tourpac */
    .tourpac-positioner {
      position: absolute;
      bottom: 48px; left: 50%;
      transform: translateX(-50%);
    }

    .lt {
      position: relative;
      width: var(--lt-width); height: var(--lt-height);
      display: flex; align-items: stretch;
      clip-path: polygon(0% 0%, calc(100% - 24px) 0%, 100% 22px, 100% 100%, 0% 100%);
      border-radius: 3px 16px 16px 3px;
      box-shadow: 0 30px 50px -20px rgba(0,0,0,.45), 0 8px 20px rgba(0,0,0,.2);
      opacity: 0;
    }
    .lt-bar {
      width: 8px; flex-shrink: 0;
      display: flex; flex-direction: column;
      border-radius: 3px 0 0 3px; overflow: hidden;
    }
    .lt-bar span { flex: 1; }
    .lt-bar span:nth-child(1) { background: var(--tp-green); }
    .lt-bar span:nth-child(2) { background: var(--tp-yellow); }
    .lt-bar span:nth-child(3) { background: var(--tp-red); }
    .lt-body {
      flex: 1;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      padding: 12px 20px 14px 18px;
      display: flex; flex-direction: column; gap: 4px;
      border-radius: 0 14px 14px 0; overflow: hidden; position: relative;
    }
    .lt-body::after {
      content: ''; position: absolute;
      bottom: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--tp-green) 0%, var(--tp-yellow) 45%, var(--tp-red) 100%);
      background-size: 200% 100%;
      animation: line-flow 4s linear infinite; opacity: 0.8;
    }
    @keyframes line-flow {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Ligne 1 tourpac Bible (référence) */
    .lt-l1 {
      font-family: 'Cinzel', serif; font-weight: 700;
      font-size: var(--lt-ref-size); letter-spacing: .08em;
      text-transform: uppercase; color: var(--tp-green);
      line-height: 1.25; opacity: 0; transform: translateY(8px);
    }
    /* Ligne 2 tourpac Bible (verset) */
    .lt-l2 {
      font-family: 'Inter', sans-serif; font-weight: 300;
      font-style: italic; font-size: var(--lt-verse-size);
      line-height: 1.55; letter-spacing: .02em;
      opacity: 0; transform: translateY(8px);
      overflow-y: auto; max-height: 100%; white-space: pre-wrap;
    }

    /* Nom personne tourpac */
    .lt-name {
      font-family: 'Cinzel', serif; font-weight: 900;
      font-size: var(--p-name-size); letter-spacing: .1em;
      text-transform: uppercase;
      opacity: 0; transform: translateY(8px);
    }
    /* Séparateur tourpac */
    .lt-sep {
      width: 40px; height: 2px; background: var(--tp-green);
      margin: 6px 0 10px; transform-origin: left;
      opacity: 0; transform: scaleX(0);
    }
    /* Titre personne tourpac */
    .lt-title {
      font-family: 'Inter', sans-serif; font-weight: 300;
      font-style: italic; font-size: var(--p-title-size);
      letter-spacing: .02em; line-height: 1.4;
      opacity: 0; transform: translateY(8px);
    }

    /* Animations tourpac */
    .tourpac-positioner.anim-in .lt {
      animation: lt-wipe-in 0.65s cubic-bezier(.16,1,.3,1) forwards,
                 lt-fade-in 0.35s ease forwards;
    }
    .tourpac-positioner.anim-out .lt {
      animation: lt-wipe-out 0.45s ease-in forwards,
                 lt-fade-out 0.35s ease-in forwards;
    }
    @keyframes lt-wipe-in {
      0%   { clip-path: inset(0 100% 0 0 round 3px 16px 16px 3px); }
      70%  { clip-path: inset(0 -4%  0 0 round 3px 16px 16px 3px); }
      100% { clip-path: inset(0 0%   0 0 round 3px 16px 16px 3px); }
    }
    @keyframes lt-fade-in  { from { opacity: 0; filter: blur(6px); } to { opacity: 1; filter: blur(0); } }
    @keyframes lt-wipe-out {
      from { clip-path: inset(0 0%   0 0 round 3px 16px 16px 3px); opacity: 1; }
      to   { clip-path: inset(0 100% 0 0 round 3px 16px 16px 3px); opacity: 0; }
    }
    @keyframes lt-fade-out { from { opacity: 1; filter: blur(0); } to { opacity: 0; filter: blur(6px); } }

    .tourpac-positioner.anim-in .lt-l1,
    .tourpac-positioner.anim-in .lt-name  { animation: text-in 0.4s 0.38s cubic-bezier(.34,1.56,.64,1) forwards; }
    .tourpac-positioner.anim-in .lt-l2,
    .tourpac-positioner.anim-in .lt-title { animation: text-in 0.4s 0.55s cubic-bezier(.34,1.56,.64,1) forwards; }
    .tourpac-positioner.anim-in .lt-sep   { animation: sep-in  0.45s 0.65s cubic-bezier(.34,1.56,.64,1) forwards; }

    .tourpac-positioner.anim-out .lt-l1,
    .tourpac-positioner.anim-out .lt-l2,
    .tourpac-positioner.anim-out .lt-name,
    .tourpac-positioner.anim-out .lt-title,
    .tourpac-positioner.anim-out .lt-sep { animation: text-out 0.25s ease-in forwards; }

    @keyframes text-in  { to { opacity: 1; transform: translateY(0) scaleX(1); } }
    @keyframes text-out { from { opacity: 1; } to { opacity: 0; transform: translateY(8px); } }
    @keyframes sep-in   { to { opacity: 1; transform: scaleX(1); } }


    /* ══ SONG DISPLAY ════════════════════════════════════════════════════ */

    #proj-song {
      background: var(--song-bg);
      font-family: var(--song-font);
      font-size: var(--song-size);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5vw;
      text-align: center;
      line-height: 1.35;
      color: var(--song-text);
      background-image: radial-gradient(circle, rgba(74,144,217,.07) 1px, transparent 1px);
      background-size: 28px 28px;
      position: relative;
    }
    #proj-song.active { display: flex; }

    .song-title  { font-size: .65em; font-weight: 700; margin-bottom: .3em; opacity: .85; letter-spacing: .05em; text-transform: uppercase; }
    .song-author { font-size: .5em; opacity: .6; margin-bottom: .8em; font-style: italic; }
    .song-lyric  { font-size: 1em; font-weight: 400; overflow-wrap: break-word; word-break: break-word; max-width: 85vw; hyphens: auto; }

    @keyframes song-fade-in {
      0%   { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .song-slide-wrap { animation: song-fade-in 300ms ease-out; }

    /* Navigation strophes (points) pour le mode Song */
    #proj-song .segment-nav {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 20;
    }
    #proj-song .seg-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transition: background 0.2s;
      cursor: pointer;
    }
    #proj-song .seg-dot.active {
      background: var(--song-text, #ffffff);
    }

    /* Indicateur strophe discret (bas droite, disparaît après 2s) */
    .song-strophe-indicator {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-family: monospace;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 20;
    }
    .song-strophe-indicator.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- ══ MODE : Blank — fond noir (état par défaut) ══════════════════════ -->
  <div id="proj-blank" class="proj-mode active">
    <!-- Intentionnellement vide -->
  </div>


  <!-- ══ MODE : Bible Lower Third ════════════════════════════════════════ -->
  <div id="proj-bible" class="proj-mode">

    <!-- Sous-mode : ictheme -->
    <div id="ictheme-bible-wrapper" style="display:none;">
      <div class="stage">
        <div class="lower-third" id="ictheme-lt">
          <div class="reference-badge"><span id="ic-bible-ref"></span></div>
          <div class="main-card">
            <div class="card-inner">
              <div class="verset-text" id="ic-bible-text"></div>
            </div>
          </div>
          <div class="segment-nav" id="ic-bible-seg-nav"></div>
        </div>
      </div>
    </div>

    <!-- Sous-mode : tourpac -->
    <div id="tourpac-bible-wrapper" class="tourpac-positioner" style="display:none;">
      <div class="lt">
        <div class="lt-bar"><span></span><span></span><span></span></div>
        <div class="lt-body">
          <div class="lt-l1" id="tp-bible-ref"></div>
          <div class="lt-l2" id="tp-bible-text"></div>
        </div>
      </div>
      <div class="segment-nav" id="tp-bible-seg-nav"></div>
    </div>

  </div>


  <!-- ══ MODE : Song Display ══════════════════════════════════════════════ -->
  <div id="proj-song" class="proj-mode">
    <!-- Points de navigation (segments) -->
    <div class="segment-nav" id="song-seg-nav"></div>
    <!-- Indicateur strophe discret -->
    <div id="song-strophe-indicator" class="song-strophe-indicator">Strophe 1 / 1</div>

    <div class="song-slide-wrap" id="song-slide-wrap">
      <div class="song-title"  id="song-title-el"  style="display:none;"></div>
      <div class="song-author" id="song-author-el" style="display:none;"></div>
      <div class="song-lyric"  id="song-lyric-el"></div>
    </div>
  </div>


  <!-- ══ MODE : Person Lower Third ════════════════════════════════════════ -->
  <div id="proj-person" class="proj-mode">

    <!-- Sous-mode : ictheme personne -->
    <div id="ictheme-person-wrapper" style="display:none;">
      <div class="stage">
        <div class="lower-third" id="ictheme-person-lt">
          <div class="title-badge"><span id="ic-person-titre"></span></div>
          <div class="main-card">
            <div class="card-inner">
              <div class="main-text" id="ic-person-nom"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Sous-mode : tourpac personne -->
    <div id="tourpac-person-wrapper" class="tourpac-positioner" style="display:none;">
      <div class="lt" id="tourpac-person-lt">
        <div class="lt-bar"><span></span><span></span><span></span></div>
        <div class="lt-body">
          <div class="lt-name"  id="tp-person-nom"></div>
          <div class="lt-sep"></div>
          <div class="lt-title" id="tp-person-titre"></div>
        </div>
      </div>
    </div>

  </div>


  <script>
    'use strict';

    // ══ État local ═══════════════════════════════════════════════════════
    let _state = {
      mode:            'blank',
      displaysVisible: true,
      bible: {
        reference: '', version: '', text: '', segment: '',
        segments: [], segmentIndex: 0, ltType: 'ictheme',
        settings: {}
      },
      song: {
        title: '', author: '', lyric: '',
        showTitle: true, showAuthor: true, isBlank: false,
        strophes: [],        // Tableau des textes des strophes
        currentStrophe: 0,   // Index de la strophe courante
        settings: {}
      },
      person: {
        nom: '', titre: '', ltType: 'ictheme',
        settings: {}
      },
    };

    // Timer pour masquer l'indicateur de strophe
    let _indicatorTimer = null;

    // ══ BroadcastChannel — synchronisé avec le canal utilisé par app.js ══
    const channel = new BroadcastChannel('projection-channel');
    channel.onmessage = (event) => {
      const msg = event.data;
      if (!msg) return;

      // 1. Gestion du format STATE_UPDATE (pour compatibilité)
      if (msg.type === 'STATE_UPDATE') {
        applyState(msg);
        return;
      }

      // 2. Gestion des commandes directes
      switch (msg.type) {
        case 'show-verse':
          if (msg.data) {
            _state.mode = 'bible';
            _state.displaysVisible = true;
            _state.bible.reference = msg.data.reference || '';
            _state.bible.version = '';
            _state.bible.text = msg.data.text || '';
            _state.bible.segment = msg.data.text || '';
            _state.bible.segments = [];
            _state.bible.segmentIndex = 0;
            _state.bible.ltType = msg.data.style?.ltType || _state.bible.ltType;
            _state.bible.settings = {
              refColor: msg.data.style?.refColor || '#ffffff',
              verseColor: msg.data.style?.verseColor || '#16308f',
              fontFamily: msg.data.style?.fontFamily || 'Arial Black',
              width: msg.data.style?.width || 1240,
              height: msg.data.style?.height || 248,
              refFontSize: msg.data.style?.refFontSize || 30,
              verseFontSize: msg.data.style?.verseFontSize || 38,
            };
            _renderBible();
          }
          break;

        case 'show-song':
          if (msg.data) {
            _state.mode = 'song';
            _state.displaysVisible = true;
            _state.song.title = msg.data.title || '';
            _state.song.author = msg.data.author || '';
            _state.song.showTitle = msg.data.showTitle !== undefined ? msg.data.showTitle : true;
            _state.song.showAuthor = msg.data.showAuthor !== undefined ? msg.data.showAuthor : true;
            // Stocker toutes les strophes (tableau de textes)
            _state.song.strophes = msg.data.strophes || [];
            _state.song.currentStrophe = msg.data.currentIndex || 0;
            // Pour compatibilité, si strophes absent, on reconstruit à partir de lines/translations
            if (_state.song.strophes.length === 0 && msg.data.lines) {
              let lyricText = '';
              const lines = msg.data.lines || [];
              const translations = msg.data.translations || [];
              for (let i = 0; i < lines.length; i++) {
                lyricText += lines[i];
                if (translations[i]) lyricText += '\n*' + translations[i];
                if (i < lines.length - 1) lyricText += '\n';
              }
              _state.song.strophes = [lyricText];
              _state.song.currentStrophe = 0;
            }
            // Appliquer les settings (couleurs, police, etc.)
            if (msg.data.settings) {
              _applyCSSVars(msg.data.settings, 'song');
              Object.assign(_state.song.settings, msg.data.settings);
            }
            _renderSong();
          }
          break;

        case 'show-person':
          if (msg.data) {
            _state.mode = 'person';
            _state.displaysVisible = true;
            _state.person.nom = msg.data.nom || '';
            _state.person.titre = msg.data.titre || '';
            _state.person.ltType = _state.bible.ltType;
            _renderPerson();
          }
          break;

        case 'hide-lower-third':
          _state.displaysVisible = false;
          _showMode('blank');
          break;

        case 'song-settings':
          if (msg.settings) {
            _applyCSSVars(msg.settings, 'song');
            Object.assign(_state.song.settings, msg.settings);
          }
          break;

        case 'song-next-strophe':
          if (_state.mode === 'song' && _state.song.strophes.length > 0) {
            const newIdx = _state.song.currentStrophe + 1;
            if (newIdx < _state.song.strophes.length) {
              _state.song.currentStrophe = newIdx;
              _renderSong();
              _showStropheIndicator();
            }
          }
          break;

        case 'song-prev-strophe':
          if (_state.mode === 'song' && _state.song.strophes.length > 0) {
            const newIdx = _state.song.currentStrophe - 1;
            if (newIdx >= 0) {
              _state.song.currentStrophe = newIdx;
              _renderSong();
              _showStropheIndicator();
            }
          }
          break;

        default:
          // Ignorer
          break;
      }
    };

    // Affiche l'indicateur de strophe pendant 2 secondes
    function _showStropheIndicator() {
      const indicator = document.getElementById('song-strophe-indicator');
      if (!indicator) return;
      const total = _state.song.strophes.length;
      indicator.textContent = `Strophe ${_state.song.currentStrophe + 1} / ${total}`;
      indicator.classList.add('visible');
      if (_indicatorTimer) clearTimeout(_indicatorTimer);
      _indicatorTimer = setTimeout(() => {
        indicator.classList.remove('visible');
      }, 2000);
    }

    // ══ Application de l'état reçu (format STATE_UPDATE) ══════════════════
    function applyState(newState) {
      if (newState.mode            !== undefined) { _state.mode            = newState.mode; }
      if (newState.displaysVisible !== undefined) { _state.displaysVisible = newState.displaysVisible; }
      if (newState.bible)  { Object.assign(_state.bible,  newState.bible); }
      if (newState.song)   { Object.assign(_state.song,   newState.song); }
      if (newState.person) { Object.assign(_state.person, newState.person); }

      if (!_state.displaysVisible) { _showMode('blank'); return; }

      switch (_state.mode) {
        case 'bible':  _renderBible();  break;
        case 'song':   _renderSong();   break;
        case 'person': _renderPerson(); break;
        default:       _showMode('blank');
      }
    }

    // ══ Switcher de mode ════════════════════════════════════════════════
    function _showMode(mode) {
      ['blank', 'bible', 'person'].forEach((m) => {
        const el = document.getElementById(`proj-${m}`);
        if (el) { el.classList.toggle('active', m === mode); }
      });
      const song = document.getElementById('proj-song');
      if (song) {
        if (mode === 'song') { song.classList.add('active'); }
        else                 { song.classList.remove('active'); }
      }
    }

    // ══ Rendu Bible LT ══════════════════════════════════════════════════
    function _renderBible() {
      _showMode('bible');
      _applyCSSVars(_state.bible.settings, 'bible');

      const ltType = _state.bible.ltType || 'ictheme';
      const icWrap = document.getElementById('ictheme-bible-wrapper');
      const tpWrap = document.getElementById('tourpac-bible-wrapper');
      const ref    = (_state.bible.version ? _state.bible.version + ' ' : '') + _state.bible.reference;
      const txt    = _state.bible.segment || _state.bible.text;

      if (ltType === 'tourpac') {
        if (icWrap) { icWrap.style.display = 'none'; }
        if (tpWrap) { tpWrap.style.display = 'block'; }
        _setText('tp-bible-ref',  ref);
        _setText('tp-bible-text', txt);
        _renderSegNav('tp-bible-seg-nav', _state.bible.segments, _state.bible.segmentIndex);
        _triggerAnim(tpWrap, 'in');
      } else {
        if (tpWrap) { tpWrap.style.display = 'none'; }
        if (icWrap) { icWrap.style.display = 'block'; }
        _setText('ic-bible-ref',  ref);
        _setText('ic-bible-text', txt);
        _renderSegNav('ic-bible-seg-nav', _state.bible.segments, _state.bible.segmentIndex);
        _triggerAnim(document.getElementById('ictheme-lt'), 'in');
      }
    }

    // ══ Rendu Song ══════════════════════════════════════════════════════
    function _renderSong() {
      _showMode('song');
      _applyCSSVars(_state.song.settings, 'song');

      const titleEl  = document.getElementById('song-title-el');
      const authorEl = document.getElementById('song-author-el');
      const lyricEl  = document.getElementById('song-lyric-el');
      const wrapEl   = document.getElementById('song-slide-wrap');

      const currentLyric = _state.song.strophes[_state.song.currentStrophe] || '';

      if (titleEl) {
        titleEl.textContent   = _state.song.title || '';
        titleEl.style.display = (_state.song.showTitle && _state.song.title) ? 'block' : 'none';
      }
      if (authorEl) {
        authorEl.textContent   = _state.song.author || '';
        authorEl.style.display = (_state.song.showAuthor && _state.song.author) ? 'block' : 'none';
      }
      if (lyricEl) {
        lyricEl.innerHTML = currentLyric.replace(/\n/g, '<br>');
      }

      // Rejouer l'animation fade-in à chaque changement de slide
      if (wrapEl) {
        wrapEl.classList.remove('song-slide-wrap');
        void wrapEl.offsetWidth;
        wrapEl.classList.add('song-slide-wrap');
      }

      // Mettre à jour les points de navigation (segments)
      const navContainer = document.getElementById('song-seg-nav');
      if (navContainer) {
        navContainer.innerHTML = '';
        const strophesCount = _state.song.strophes.length;
        if (strophesCount > 1) {
          for (let i = 0; i < strophesCount; i++) {
            const dot = document.createElement('span');
            dot.className = 'seg-dot';
            if (i === _state.song.currentStrophe) dot.classList.add('active');
            dot.addEventListener('click', () => {
              if (i !== _state.song.currentStrophe) {
                _state.song.currentStrophe = i;
                _renderSong();
                _showStropheIndicator();
                // Optionnel: envoyer un message pour synchroniser l'app principale ? Non requis.
              }
            });
            navContainer.appendChild(dot);
          }
        }
      }
    }

    // ══ Rendu Personne LT ═══════════════════════════════════════════════
    function _renderPerson() {
      _showMode('person');
      _applyCSSVars(_state.person.settings, 'person');

      const ltType = _state.person.ltType || 'ictheme';
      const icWrap = document.getElementById('ictheme-person-wrapper');
      const tpWrap = document.getElementById('tourpac-person-wrapper');

      if (ltType === 'tourpac') {
        if (icWrap) { icWrap.style.display = 'none'; }
        if (tpWrap) { tpWrap.style.display = 'block'; }
        _setText('tp-person-nom',   _state.person.nom);
        _setText('tp-person-titre', _state.person.titre);
        _triggerAnim(tpWrap, 'in');
      } else {
        if (tpWrap) { tpWrap.style.display = 'none'; }
        if (icWrap) { icWrap.style.display = 'block'; }
        _setText('ic-person-titre', _state.person.titre);
        _setText('ic-person-nom',   _state.person.nom);
        _triggerAnim(document.getElementById('ictheme-person-lt'), 'in');
      }
    }

    // ══ Helpers ══════════════════════════════════════════════════════════

    function _setText(id, text) {
      const el = document.getElementById(id);
      if (el) { el.textContent = text || ''; }
    }

    function _applyCSSVars(settings, mode) {
      if (!settings) return;
      const r = document.documentElement;
      if (mode === 'bible' || mode === 'person') {
        if (settings.refColor)      r.style.setProperty('--lt-ref-text',    settings.refColor);
        if (settings.verseColor)    r.style.setProperty('--lt-verse-text',  settings.verseColor);
        if (settings.fontFamily)    r.style.setProperty('--lt-font',        `'${settings.fontFamily}', sans-serif`);
        if (settings.width)         r.style.setProperty('--lt-width',       `${settings.width}px`);
        if (settings.height)        r.style.setProperty('--lt-height',      `${settings.height}px`);
        if (settings.refFontSize)   r.style.setProperty('--lt-ref-size',    `${settings.refFontSize}px`);
        if (settings.verseFontSize) r.style.setProperty('--lt-verse-size',  `${settings.verseFontSize}px`);
        if (settings.nameFontSize)  r.style.setProperty('--p-name-size',    `${settings.nameFontSize}px`);
        if (settings.titleFontSize) r.style.setProperty('--p-title-size',   `${settings.titleFontSize}px`);
      }
      if (mode === 'song') {
        if (settings.bgColor) {
          r.style.setProperty('--song-bg', settings.bgColor);
          const songEl = document.getElementById('proj-song');
          if (songEl) songEl.style.background = settings.bgColor;
        }
        if (settings.textColor)  r.style.setProperty('--song-text', settings.textColor);
        if (settings.fontFamily) r.style.setProperty('--song-font', `'${settings.fontFamily}', sans-serif`);
        if (settings.fontSize)   r.style.setProperty('--song-size', `${settings.fontSize}px`);
      }
    }

    function _triggerAnim(wrapper, direction) {
      if (!wrapper) return;
      const addCls    = direction === 'in' ? 'anim-in'  : 'anim-out';
      const removeCls = direction === 'in' ? 'anim-out' : 'anim-in';
      wrapper.classList.remove(removeCls);
      void wrapper.offsetWidth;
      wrapper.classList.add(addCls);
    }

    function _renderSegNav(navId, segments, activeIndex) {
      const nav = document.getElementById(navId);
      if (!nav) return;
      nav.innerHTML = '';
      if (!segments || segments.length <= 1) return;
      segments.forEach((_, i) => {
        const dot = document.createElement('span');
        dot.className = 'seg-dot' + (i === activeIndex ? ' active' : '');
        nav.appendChild(dot);
      });
    }

    console.warn('[Projection] Fenêtre active — BroadcastChannel "projection-channel" en écoute ✓ (Song navigation ready)');
  </script>
</body>

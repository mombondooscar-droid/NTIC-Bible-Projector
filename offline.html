<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NAGAD Bible — Hors ligne">
  <title>Hors Ligne — NAGAD Bible</title>
  <style>
    /* ── Variables inline (pas de dépendance style.css) ── */
    :root {
      --bg: #0a0e1a;
      --bg-card: #10182b;
      --text: #e8eaf0;
      --text-muted: #8892a4;
      --accent: #2347d1;
      --danger: #ff4f4f;
      --border: rgba(255, 255, 255, 0.07);
      --radius: 16px;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      /* Grille subtile en fond */
      background-image: linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── Carte centrale ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.5),
                  0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    }

    /* ── Icône ── */
    .icon-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: rgba(255, 79, 79, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      border: 1px solid rgba(255, 79, 79, 0.25);
    }

    /* ── Titre ── */
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      color: var(--text);
    }

    /* ── Description ── */
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    p + p {
      margin-bottom: 2rem;
    }

    /* ── Badge info ── */
    .info-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(35, 71, 209, 0.15);
      border: 1px solid rgba(35, 71, 209, 0.3);
      color: #6fa3ff;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }

    /* ── Bouton retour ── */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #0a2f8b, #2347d1);
      color: #ffffff;
      text-decoration: none;
      padding: 0.75rem 1.75rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: opacity 0.2s ease, transform 0.15s ease;
      box-shadow: 0 4px 16px rgba(35, 71, 209, 0.4);
    }

    .btn-back:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-back:active {
      transform: translateY(0);
    }

    /* ── Footer de la carte ── */
    .card-footer {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card {
        padding: 2rem 1.5rem;
      }

      h1 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- Icône -->
    <div class="icon-wrap" role="img" aria-label="Hors ligne">
      📴
    </div>

    <!-- Titre & message -->
    <h1>Vous êtes hors ligne</h1>
    <p>La connexion réseau est indisponible pour le moment.</p>
    <p>Vos données mises en cache restent accessibles.</p>

    <!-- Info cache -->
    <div class="info-badge">
      <span aria-hidden="true">💾</span>
      <span>Les données locales sont préservées</span>
    </div>

    <!-- Bouton retour -->
    <a href="./index.html" class="btn-back">
      <span aria-hidden="true">←</span>
      Retourner à l'accueil
    </a>

    <!-- Footer -->
    <div class="card-footer">
      NAGAD Bible &nbsp;·&nbsp; ICC Brazzaville
    </div>

  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTIC Bible Projector — Projection LT Personne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:ital,wght@0,300;0,400;1,300&display=swap">
  <style>
    /* ══ VARIABLES & RESET ══════════════════════════════════════════════════ */
    :root {
      --lt-font:       'Arial Black', sans-serif;
      --lt-width:      1240px;
      --lt-height:     248px;
      --lt-ref-size:   30px;
      --lt-verse-size: 38px;

      --tp-green:  #009A44;
      --tp-yellow: #FBDE4A;
      --tp-red:    #DC241F;

      --p-name-size:  30px;
      --p-title-size: 24px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* Fenêtre LT : fond toujours transparent (chroma-key OBS) */
    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: transparent;
    }

    .proj-mode {
      display: none;
      width: 100vw; height: 100vh;
      position: relative;
    }
    .proj-mode.active { display: block; }


    /* ══ GRADUATION (ictheme) — PERSONNE LT ═══════════════════════════════ */

    /* Positionneur deux-blocs graduation personne */
    .graduation-person-positioner {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      width: 80%;
      max-width: 1000px;
    }

    /* Bloc gauche : fond blanc, nom sombre */
    .grad-left-block {
      background: #ffffff;
      height: 120px;
      flex: 1;
      border-top-right-radius: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 40px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    /* Bloc droit : gradient violet→rouge, texte blanc */
    .grad-right-block {
      background: linear-gradient(to right, #0a194e, #4a148c, #b71c1c);
      height: 120px;
      flex: 1;
      border-top-left-radius: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 40px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .grad-person-name {
      font-size: var(--p-name-size);
      font-family: var(--lt-font);
      font-weight: 900;
      color: #222222;
      margin: 0;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .grad-person-titre {
      font-size: var(--p-title-size);
      font-family: var(--lt-font);
      font-weight: 600;
      color: #555555;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .grad-right-block .grad-person-name  { color: #ffffff; }
    .grad-right-block .grad-person-titre { color: #e0e0e0; font-weight: 400; }

    /* Animations graduation personne */
    .graduation-person-positioner.anim-in {
      animation: gradPersonSlideIn 0.8s ease-out forwards;
    }
    .graduation-person-positioner.anim-out {
      animation: gradPersonSlideOut 0.5s ease-in forwards;
    }
    @keyframes gradPersonSlideIn {
      from { transform: translate(-50%, 200px); opacity: 0; }
      to   { transform: translate(-50%, 0);     opacity: 1; }
    }
    @keyframes gradPersonSlideOut {
      from { transform: translate(-50%, 0);     opacity: 1; }
      to   { transform: translate(-50%, 200px); opacity: 0; }
    }


    /* ══ TOURPAC — PERSONNE LT ════════════════════════════════════════════ */

    .tourpac-positioner {
      position: absolute;
      bottom: 48px; left: 50%;
      transform: translateX(-50%);
    }

    .lt {
      position: relative;
      width: var(--lt-width); height: var(--lt-height);
      display: flex; align-items: stretch;
      clip-path: polygon(0% 0%, calc(100% - 24px) 0%, 100% 22px, 100% 100%, 0% 100%);
      border-radius: 3px 16px 16px 3px;
      box-shadow: 0 30px 50px -20px rgba(0,0,0,.45), 0 8px 20px rgba(0,0,0,.2);
      opacity: 0;
    }
    .lt-bar {
      width: 8px; flex-shrink: 0;
      display: flex; flex-direction: column;
      border-radius: 3px 0 0 3px; overflow: hidden;
    }
    .lt-bar span { flex: 1; }
    .lt-bar span:nth-child(1) { background: var(--tp-green); }
    .lt-bar span:nth-child(2) { background: var(--tp-yellow); }
    .lt-bar span:nth-child(3) { background: var(--tp-red); }
    .lt-body {
      flex: 1;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      padding: 12px 20px 14px 18px;
      display: flex; flex-direction: column; gap: 4px;
      border-radius: 0 14px 14px 0; overflow: hidden; position: relative;
    }
    .lt-body::after {
      content: ''; position: absolute;
      bottom: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--tp-green) 0%, var(--tp-yellow) 45%, var(--tp-red) 100%);
      background-size: 200% 100%;
      animation: line-flow 4s linear infinite; opacity: 0.8;
    }
    @keyframes line-flow {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Nom personne tourpac */
    .lt-name {
      font-family: var(--lt-font, 'Cinzel', serif); font-weight: 900;
      font-size: var(--p-name-size); letter-spacing: .1em;
      text-transform: uppercase;
      opacity: 0; transform: translateY(8px);
    }
    /* Séparateur tourpac */
    .lt-sep {
      width: 40px; height: 2px; background: var(--tp-green);
      margin: 6px 0 10px; transform-origin: left;
      opacity: 0; transform: scaleX(0);
    }
    /* Titre personne tourpac */
    .lt-title {
      font-family: var(--lt-font, 'Inter', sans-serif); font-weight: 300;
      font-style: italic; font-size: var(--p-title-size);
      letter-spacing: .02em; line-height: 1.4;
      opacity: 0; transform: translateY(8px);
    }

    /* Animations tourpac */
    .tourpac-positioner.anim-in .lt {
      animation: lt-wipe-in 0.65s cubic-bezier(.16,1,.3,1) forwards,
                 lt-fade-in 0.35s ease forwards;
    }
    .tourpac-positioner.anim-out .lt {
      animation: lt-wipe-out 0.45s ease-in forwards,
                 lt-fade-out 0.35s ease-in forwards;
    }
    @keyframes lt-wipe-in {
      0%   { clip-path: inset(0 100% 0 0 round 3px 16px 16px 3px); }
      70%  { clip-path: inset(0 -4%  0 0 round 3px 16px 16px 3px); }
      100% { clip-path: inset(0 0%   0 0 round 3px 16px 16px 3px); }
    }
    @keyframes lt-fade-in  { from { opacity: 0; filter: blur(6px); } to { opacity: 1; filter: blur(0); } }
    @keyframes lt-wipe-out {
      from { clip-path: inset(0 0%   0 0 round 3px 16px 16px 3px); opacity: 1; }
      to   { clip-path: inset(0 100% 0 0 round 3px 16px 16px 3px); opacity: 0; }
    }
    @keyframes lt-fade-out { from { opacity: 1; filter: blur(0); } to { opacity: 0; filter: blur(6px); } }

    .tourpac-positioner.anim-in .lt-name  { animation: text-in 0.4s 0.38s cubic-bezier(.34,1.56,.64,1) forwards; }
    .tourpac-positioner.anim-in .lt-sep   { animation: sep-in  0.45s 0.65s cubic-bezier(.34,1.56,.64,1) forwards; }
    .tourpac-positioner.anim-in .lt-title { animation: text-in 0.4s 0.55s cubic-bezier(.34,1.56,.64,1) forwards; }

    .tourpac-positioner.anim-out .lt-name,
    .tourpac-positioner.anim-out .lt-sep,
    .tourpac-positioner.anim-out .lt-title { animation: text-out 0.25s ease-in forwards; }

    @keyframes text-in  { to { opacity: 1; transform: translateY(0) scaleX(1); } }
    @keyframes text-out { from { opacity: 1; } to { opacity: 0; transform: translateY(8px); } }
    @keyframes sep-in   { to { opacity: 1; transform: scaleX(1); } }
  </style>
</head>
<body>

  <!-- ══ MODE : Blank — transparent (état par défaut) ═══════════════════ -->
  <div id="proj-blank" class="proj-mode active">
    <!-- Intentionnellement vide -->
  </div>

  <!-- ══ MODE : Person Lower Third ════════════════════════════════════════ -->
  <div id="proj-person" class="proj-mode">

    <!-- Sous-mode : ictheme / graduation — deux blocs côte-à-côte -->
    <div id="graduation-person-wrapper" class="graduation-person-positioner" style="display:none;">
      <div class="grad-left-block">
        <p class="grad-person-name"  id="grad-person-nom"></p>
        <p class="grad-person-titre" id="grad-person-titre-sub"></p>
      </div>
      <div class="grad-right-block">
        <p class="grad-person-name"  id="grad-person-titre"></p>
      </div>
    </div>

    <!-- Sous-mode : tourpac personne -->
    <div id="tourpac-person-wrapper" class="tourpac-positioner" style="display:none;">
      <div class="lt" id="tourpac-person-lt">
        <div class="lt-bar"><span></span><span></span><span></span></div>
        <div class="lt-body">
          <div class="lt-name"  id="tp-person-nom"></div>
          <div class="lt-sep"></div>
          <div class="lt-title" id="tp-person-titre"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Constantes + utilitaires partagés (autonome) -->
  <script src="./constants.js"></script>
  <script src="./projection-shared.js"></script>

  <script>
    'use strict';

    const MODE_IDS = ['proj-blank', 'proj-person'];

    // ══ Canal dédié — projection-lt-personne ══════════════════════════════
    const channel = createProjectionChannel(PROJECTION_CHANNELS.LT_PERSONNE);

    // ══ État local ════════════════════════════════════════════════════════
    let _state = {
      mode: 'blank',
      person: {
        nom: '', titre: '', ltType: 'ictheme',
        settings: {},
      },
    };

    // ══ GESTIONNAIRE DE MESSAGES ══════════════════════════════════════════
    channel.onmessage = (event) => {
      const msg = event.data;
      if (!isValidProjectionMessage(msg)) return;

      switch (msg.type) {

        // ── Lower-third personne ──────────────────────────────────────────
        case 'show-person':
          if (msg.data) {
            _state.mode = 'person';
            _state.person.nom      = msg.data.nom    || '';
            _state.person.titre    = msg.data.titre  || '';
            _state.person.ltType   = msg.data.ltType || 'ictheme';
            _state.person.settings = msg.data.settings || {};
            _renderPerson();
          }
          break;

        // ── Masquage (Escape) ─────────────────────────────────────────────
        case 'hide-lower-third':
          _state.mode = 'blank';
          showProjectionMode(MODE_IDS, 'proj-blank');
          break;

        default:
          break;
      }
    };

    // ══ Rendu Personne LT ═════════════════════════════════════════════════
    function _renderPerson() {
      showProjectionMode(MODE_IDS, 'proj-person');
      _applyLTCSSVars(_state.person.settings);

      const ltType = _state.person.ltType || 'ictheme';
      const icWrap = document.getElementById('graduation-person-wrapper');
      const tpWrap = document.getElementById('tourpac-person-wrapper');

      if (ltType === 'tourpac') {
        if (icWrap) icWrap.style.display = 'none';
        if (tpWrap) tpWrap.style.display = 'block';
        _setText('tp-person-nom',   _state.person.nom);
        _setText('tp-person-titre', _state.person.titre);
        triggerProjectionAnim(tpWrap, 'in');
      } else {
        // 'ictheme' et 'graduation' partagent le même habillage violet
        if (tpWrap) tpWrap.style.display = 'none';
        if (icWrap) icWrap.style.display = 'flex';
        _setText('grad-person-nom',       _state.person.nom);
        _setText('grad-person-titre',     _state.person.titre);
        _setText('grad-person-titre-sub', '');   // sous-titre gauche vide par défaut
        triggerProjectionAnim(icWrap, 'in');
      }
    }

    // ══ Helpers ═══════════════════════════════════════════════════════════
    function _setText(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text || '';
    }

    /** Applique les variables CSS de la personne (police, tailles). */
    function _applyLTCSSVars(settings) {
      if (!settings) return;
      const r = document.documentElement;
      if (settings.fontFamily)    r.style.setProperty('--lt-font',        `'${settings.fontFamily}', sans-serif`);
      if (settings.width)         r.style.setProperty('--lt-width',       `${settings.width}px`);
      if (settings.height)        r.style.setProperty('--lt-height',      `${settings.height}px`);
      if (settings.nameFontSize)  r.style.setProperty('--p-name-size',    `${settings.nameFontSize}px`);
      if (settings.titleFontSize) r.style.setProperty('--p-title-size',   `${settings.titleFontSize}px`);
    }

    console.warn('[Projection-LT-Personne] Fenêtre active — canal "' + PROJECTION_CHANNELS.LT_PERSONNE + '" en écoute ✓');
  </script>
</body>
</html>

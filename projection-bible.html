<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTIC Bible Projector — Projection Bible</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:ital,wght@0,300;0,400;1,300&display=swap">
  <style>
    /* ══ VARIABLES & RESET ══════════════════════════════════════════════════ */
    :root {
      /* Variables verset (mode bible plein écran) — alimentées par show-verse.style */
      --slide-ref-size:    32px;
      --slide-verse-size:  48px;
      --slide-ref-color:   #f0c060;
      --slide-verse-color: #f5f0e8;
      --slide-font:        'Arial', sans-serif;
      --slide-text-align:  center;
      --slide-bg:          #0a0a0a;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: var(--slide-bg, #000000);
    }

    /* ── Conteneurs de mode (tous cachés par défaut) ── */
    .proj-mode {
      display: none;
      width: 100vw; height: 100vh;
      position: relative;
      align-items: center;
      justify-content: center;
    }
    .proj-mode.active { display: flex; }

    /* ══ MODE BIBLE / SLIDE — plein écran ════════════════════════════════ */
    .slide-inner {
      text-align: center;
      max-width: 900px;
      width: 100%;
      border-radius: 24px;
      padding: 2rem;
      background: var(--slide-bg, #000000);
      position: relative;
    }
    .slide-ref {
      font-family: var(--slide-font, 'Arial', sans-serif);
      font-size: calc(var(--slide-ref-size, 32) * 1px);
      color: var(--slide-ref-color, #f0c060);
      margin-bottom: 24px;
      font-weight: bold;
      text-align: center;
    }
    .slide-verse {
      font-family: var(--slide-font, 'Arial', sans-serif);
      font-size: calc(var(--slide-verse-size, 48) * 1px);
      color: var(--slide-verse-color, #ffffff);
      line-height: 1.6;
      text-align: var(--slide-text-align, center);
      padding: 0 2rem;
      max-width: 85%;
      margin: 0 auto;
      white-space: pre-wrap;
    }

    /* Points de navigation segments (verset long, mode bible plein écran) */
    .segment-nav {
      position: absolute;
      left: 50%; bottom: -36px;
      transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 10;
    }
    .seg-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,.25);
      transition: background 0.2s;
    }
    .seg-dot.active { background: var(--slide-verse-color, #ffffff); }

    /* Fade-in léger lors d'un changement de contenu */
    @keyframes proj-fade-in {
      0%   { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .proj-fade { animation: proj-fade-in 300ms ease-out; }

    /* ══ MODE DUAL (bilingue) — Demande #6 ═══════════════════════════════ */
    #proj-dual {
      display: none;
      width: 100vw;
      height: 100vh;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      background: var(--slide-bg, #000);
    }
    #proj-dual.active { display: flex; }
    .dual-verse-box {
      flex: 1;
      text-align: center;
      background: rgba(0,0,0,0.6);
      border-radius: 24px;
      padding: 1.5rem;
      max-width: 45%;
      transition: opacity 0.3s ease;
    }
    .dual-verse-ref {
      font-size: calc(var(--slide-ref-size, 32) * 1px);
      color: var(--slide-ref-color, #f0c060);
      margin-bottom: 0.5rem;
      font-weight: bold;
    }
    .dual-verse-text {
      font-size: calc(var(--slide-verse-size, 48) * 1px);
      color: var(--slide-verse-color, #fff);
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- ══ MODE : Blank — fond noir/slideBg (état par défaut) ══════════════ -->
  <div id="proj-blank" class="proj-mode active">
    <!-- Intentionnellement vide -->
  </div>

  <!-- ══ MODE : Bible — verset en plein écran ═════════════════════════════ -->
  <div id="proj-bible" class="proj-mode">
    <div class="slide-inner" id="bible-inner">
      <div id="bible-reference" class="slide-ref"></div>
      <div id="bible-text" class="slide-verse"></div>
      <div class="segment-nav" id="bible-seg-nav"></div>
    </div>
  </div>

  <!-- ══ MODE : Slide — diapositive plein écran ═══════════════════════════ -->
  <div id="proj-slide" class="proj-mode">
    <div class="slide-inner" id="slide-inner">
      <div id="slide-reference" class="slide-ref"></div>
      <div id="slide-text" class="slide-verse"></div>
    </div>
  </div>

  <!-- ══ MODE : Dual (bilingue) — Demande #6 ═══════════════════════════════ -->
  <div id="proj-dual" class="proj-mode">
    <div class="dual-verse-box" id="dual-box-a">
      <div id="dual-ref-a" class="dual-verse-ref"></div>
      <div id="dual-text-a" class="dual-verse-text"></div>
    </div>
    <div class="dual-verse-box" id="dual-box-b">
      <div id="dual-ref-b" class="dual-verse-ref"></div>
      <div id="dual-text-b" class="dual-verse-text"></div>
    </div>
  </div>

  <!-- Constantes + utilitaires partagés (autonome) -->
  <script src="./constants.js"></script>
  <script src="./projection-shared.js"></script>

  <script>
    'use strict';

    const MODE_IDS = ['proj-blank', 'proj-bible', 'proj-slide', 'proj-dual'];

    // ══ Canal dédié — projection-bible ════════════════════════════════════
    const channel = createProjectionChannel(PROJECTION_CHANNELS.BIBLE);

    // ══ État local ═══════════════════════════════════════════════════════
    let _state = {
      mode: 'blank',
      bible: {
        reference: '', text: '', segment: '',
        segments: [], segmentIndex: 0,
      },
      dual: {
        verseA: null,
        verseB: null,
        mode: 'side',
        interval: 5,
      },
    };

    let _dualAlternateTimer = null;

    // ══ GESTIONNAIRE DE MESSAGES ═══════════════════════════════════════════
    channel.onmessage = (event) => {
      const msg = event.data;
      if (!isValidProjectionMessage(msg)) return;

      switch (msg.type) {
        // ── Verset Bible — affichage plein écran ──────────────────────────
        case 'show-verse':
          if (msg.data) {
            _state.mode = 'bible';
            _state.bible.reference   = msg.data.reference || '';
            _state.bible.text        = msg.data.text || '';
            _state.bible.segment     = msg.data.text || '';
            _state.bible.segments    = [];
            _state.bible.segmentIndex = 0;
            _applyBibleStyle(msg.data.style || {});
            _renderBible();
            // Arrêter l'alternance dual si elle tournait
            _stopDualAlternate();
          }
          break;

        // ── Segment d'un verset long (US-19) ──────────────────────────────
        case 'verse:segment':
          if (msg.segmentText !== undefined) {
            _state.mode = 'bible';
            if (msg.reference) _state.bible.reference = msg.reference;
            _state.bible.segment      = msg.segmentText;
            _state.bible.segmentIndex = msg.segmentIndex || 0;
            if (msg.totalSegments && msg.totalSegments > 0) {
              _state.bible.segments = Array.from({ length: msg.totalSegments }, (_, i) => i);
            }
            if (msg.style) _applyBibleStyle(msg.style);
            _renderBible();
          }
          break;

        // ── Diapositive (mode slide) ──────────────────────────────────────
        case 'show-slide':
          if (msg.data) {
            _state.mode = 'slide';
            _state.slide = {
              reference: msg.data.reference || '',
              text:      msg.data.text || '',
            };
            _applySlideStyle(msg.data.style || {});
            _renderSlide();
            _stopDualAlternate();
          }
          break;

        case 'slide-settings':
          if (msg.settings) {
            _applySlideStyle(msg.settings);
          }
          break;

        // ── Mode dual (bilingue) ──────────────────────────────────────────
        case 'show-dual-verse':
          if (msg.data) {
            _state.mode = 'dual';
            _state.dual.verseA = msg.data.verseA;
            _state.dual.verseB = msg.data.verseB;
            _state.dual.mode   = msg.data.mode || 'side';
            _state.dual.interval = msg.data.interval || 5;
            _applyBibleStyle(msg.data.style || {});
            _renderDual();
            if (_state.dual.mode === 'alternate') {
              _startDualAlternate();
            } else {
              _stopDualAlternate();
            }
          }
          break;

        // ── Surlignage (US-20) ────────────────────────────────────────────
        case 'highlight:words':
          if (msg.selectedText) {
            highlightProjectionText(document.getElementById('bible-text'), msg.selectedText, msg.color || '#FFD700');
          }
          break;

        case 'highlight:clear':
          if (_state.mode === 'bible') _renderBible();
          break;

        // ── Masquage (Escape) ─────────────────────────────────────────────
        case 'hide-lower-third':
          _state.mode = 'blank';
          showProjectionMode(MODE_IDS, 'proj-blank');
          _stopDualAlternate();
          break;

        default:
          // Ignorer les messages destinés aux autres fenêtres
          break;
      }
    };

    // ══ Rendu — mode Bible plein écran ═════════════════════════════════════
    function _renderBible() {
      showProjectionMode(MODE_IDS, 'proj-bible');

      const refEl  = document.getElementById('bible-reference');
      const textEl = document.getElementById('bible-text');
      const inner  = document.getElementById('bible-inner');

      if (refEl)  refEl.textContent  = _state.bible.reference || '';
      if (textEl) textEl.textContent = _state.bible.segment || _state.bible.text || '';

      renderProjectionSegNav('bible-seg-nav', _state.bible.segments, _state.bible.segmentIndex);

      // Rejouer une légère animation d'entrée
      if (inner) {
        inner.classList.remove('proj-fade');
        void inner.offsetWidth;
        inner.classList.add('proj-fade');
      }
    }

    // ══ Rendu — mode Slide plein écran ══════════════════════════════════════
    function _renderSlide() {
      showProjectionMode(MODE_IDS, 'proj-slide');

      const refEl  = document.getElementById('slide-reference');
      const textEl = document.getElementById('slide-text');
      const inner  = document.getElementById('slide-inner');

      if (refEl)  refEl.textContent  = _state.slide.reference || '';
      if (textEl) textEl.textContent = _state.slide.text || '';

      if (inner) {
        inner.classList.remove('proj-fade');
        void inner.offsetWidth;
        inner.classList.add('proj-fade');
      }
    }

    // ══ Rendu — mode Dual (bilingue) ════════════════════════════════════════
    function _renderDual() {
      showProjectionMode(MODE_IDS, 'proj-dual');
      const refA = document.getElementById('dual-ref-a');
      const textA = document.getElementById('dual-text-a');
      const refB = document.getElementById('dual-ref-b');
      const textB = document.getElementById('dual-text-b');
      if (refA) refA.textContent = _state.dual.verseA?.ref || '';
      if (textA) textA.textContent = _state.dual.verseA?.text || '';
      if (refB) refB.textContent = _state.dual.verseB?.ref || '';
      if (textB) textB.textContent = _state.dual.verseB?.text || '';
      // Pour le mode côte à côte, les deux blocs sont visibles
      if (_state.dual.mode === 'side') {
        document.getElementById('dual-box-a').style.display = 'flex';
        document.getElementById('dual-box-b').style.display = 'flex';
      } else {
        // En mode alternance, un seul bloc visible initialement (le premier)
        document.getElementById('dual-box-a').style.display = 'flex';
        document.getElementById('dual-box-b').style.display = 'none';
      }
    }

    // ══ Alternance pour le mode dual ════════════════════════════════════════
    function _startDualAlternate() {
      if (_dualAlternateTimer) clearInterval(_dualAlternateTimer);
      let showA = true;
      _dualAlternateTimer = setInterval(() => {
        showA = !showA;
        const boxA = document.getElementById('dual-box-a');
        const boxB = document.getElementById('dual-box-b');
        if (boxA && boxB) {
          if (showA) {
            boxA.style.display = 'flex';
            boxB.style.display = 'none';
          } else {
            boxA.style.display = 'none';
            boxB.style.display = 'flex';
          }
        }
      }, _state.dual.interval * 1000);
    }

    function _stopDualAlternate() {
      if (_dualAlternateTimer) {
        clearInterval(_dualAlternateTimer);
        _dualAlternateTimer = null;
      }
      // Rétablir l'affichage côte à côte si nécessaire (optionnel)
      if (_state.mode === 'dual' && _state.dual.mode === 'alternate') {
        // On ne modifie pas l'affichage ici ; l'utilisateur peut repasser en mode side via un nouveau message.
      }
    }

    // ══ Application des styles CSS — verset Bible plein écran ══════════════
    // Les styles "show-verse" proviennent de App.settings.lt* (Lower Third) :
    // on les réutilise pour la mise en forme du verset en plein écran.
    function _applyBibleStyle(style) {
      const r = document.documentElement;
      if (style.refColor)      r.style.setProperty('--slide-ref-color',   style.refColor);
      if (style.verseColor)    r.style.setProperty('--slide-verse-color', style.verseColor);
      if (style.fontFamily)    r.style.setProperty('--slide-font',        `'${style.fontFamily}', sans-serif`);
      if (style.refFontSize)   r.style.setProperty('--slide-ref-size',    `${style.refFontSize}px`);
      if (style.verseFontSize) r.style.setProperty('--slide-verse-size',  `${style.verseFontSize}px`);
    }

    // ══ Application des styles CSS — diapositive (settingsPanel) ═══════════
    function _applySlideStyle(style) {
      const r = document.documentElement;
      if (style.refSize)    r.style.setProperty('--slide-ref-size',   style.refSize + 'px');
      if (style.verseSize)  r.style.setProperty('--slide-verse-size', style.verseSize + 'px');
      if (style.refColor)   r.style.setProperty('--slide-ref-color',  style.refColor);
      if (style.verseColor) r.style.setProperty('--slide-verse-color', style.verseColor);
      if (style.font)       r.style.setProperty('--slide-font', `'${style.font}', sans-serif`);
      if (style.textAlign)  r.style.setProperty('--slide-text-align', style.textAlign);
      if (style.bg) {
        r.style.setProperty('--slide-bg', style.bg);
        document.body.style.background = style.bg;
      }
    }

    console.warn('[Projection-Bible] Fenêtre active — canal "' + PROJECTION_CHANNELS.BIBLE + '" en écoute ✓');
  </script>
</body>
</html>
